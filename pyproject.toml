[project]
name = "beta"
version = "0.1.0"
description = "Bloc analysis project"
readme = "README.md"
authors = [
    { name = "Victor Galizzi", email = "victor.galizzi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.43.116",
    "celery[redis]>=5.6.3",
    "fastapi>=0.157.0",
    "pydantic-settings>=2.16.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "celery-types>=0.26.0",
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

# --- Ruff: lint + format ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]     # lets Ruff tell first-party imports from third-party ones

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors and warnings
    "F",        # pyflakes: unused variables, dead imports
    "I",        # isort: import order
    "UP",       # pyupgrade: modern syntax for the target Python version
    "B",        # bugbear: classic pitfalls (mutable default argument, etc.)
    "SIM",      # code simplifications
    "ANN",      # missing type annotations
    "RUF",      # Ruff-specific rules
]
ignore = [
    "ANN401",   # allow Any when it is explicitly intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]   # no annotation required on every test function

# --- Mypy: strict typing ----------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true              # enables a dozen checks at once
warn_unreachable = true    # reports dead code
show_error_codes = true    # shows error codes, needed to target an ignore
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false   # leniency for tests, not for application code

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: test requiring real services (Postgres, object storage)",
]
