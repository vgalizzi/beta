services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  broker:
    image: valkey/valkey:9
    command: ["valkey-server", "--save", "", "--appendonly", "no"]   # no persistence: see ADR 0003
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # valkey-cli exits 0 even when the server replies with an error: require PONG
      test: ["CMD-SHELL", "[ \"$$(valkey-cli PING)\" = PONG ]"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "http://127.0.0.1:8333/healthz", "-O", "/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bucket-init:
    image: ghcr.io/astral-sh/uv:0.13.4-python3.12-trixie-slim
    environment:
      STORAGE_URL_INTERNAL: ${STORAGE_URL_INTERNAL}
      UV_CACHE_DIR: /root/.cache/uv
      BUCKET_NAME: ${BUCKET_NAME}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    command: ["uv", "run","--locked", "--script", "/script/script_init_bucket.py"]
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      - ./docker/init-bucket:/script:ro          # bind mount: a host directory, read-only
      - bucket-init-cache-uv:/root/.cache/uv
    restart: no

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BROKER_URL: redis://broker:6379/0
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_URL_INTERNAL: http://storage:8333
      STORAGE_URL_PUBLIC: http://localhost:833
      BUCKET_NAME: ${BUCKET_NAME}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BROKER_URL: redis://broker:6379/0
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_URL_INTERNAL: http://storage:8333
      STORAGE_URL_PUBLIC: http://localhost:833
      BUCKET_NAME: ${BUCKET_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  storage-data:
  bucket-init-cache-uv:
