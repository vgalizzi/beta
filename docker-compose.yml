services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "http://127.0.0.1:8333/healthz", "-O", "/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bucket-init:
    image: ghcr.io/astral-sh/uv:0.13.4-python3.12-trixie-slim
    environment:
      STORAGE_URL: http://storage:8333
      UV_CACHE_DIR: /root/.cache/uv
      BUCKET_NAME: ${BUCKET_NAME}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    command: ["uv", "run","--locked", "--script", "/script/script_init_bucket.py"]
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      - ./docker/init-bucket:/script:ro          # bind mount : un dossier de l'hôte, en lecture seule
      - bucket-init-cache-uv:/root/.cache/uv
    restart: no

volumes:
  database:
  storage-data:
  bucket-init-cache-uv:
